[tool.poetry]
name = "oe-szakdoga"
version = "0.1.0"
description = ""
authors = ["Soltesz Gabor Armin <solteszarmin1@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^2.1.3"
pandas = "^2.2.3"
torch={version="2.5.1",source="torch"}
torchvision={version="0.20.1",source="torch"}
torchaudio={version="2.5.1",source="torch"}


torch-geometric="2.6.1"
pyg-lib={version="0.4.0",source="pyg"}
torch_scatter={version="2.1.2",source="pyg"}
torch_sparse={version="0.6.18",source="pyg"}
torch_cluster={version="1.6.3",source="pyg"}
torch_spline_conv={version="1.2.2",source="pyg"}
matplotlib = "^3.9.2"
fastapi = "^0.115.5"
uvicorn = "^0.32.1"
pydantic = "^2.10.3"

[[tool.poetry.source]]
name = "torch"
url = "https://download.pytorch.org/whl/cu124"
secondary = true

[[tool.poetry.source]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.5.0+cu124.html"
secondary = true


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
